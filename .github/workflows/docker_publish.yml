name: Despliegue en docker hub

on:
    push:
        branches:
                - main


jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout del codigo
              uses: actions/checkout@v6

            - name: Iniciar sesion en docker hub
              uses: docker/login-action@v4
              with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            - name: COnfigurar docker build
              uses: docker/setup-buildx-action@v3

            - name: Construir y subir imagen en dockerhub
              uses: docker/build-push-action@v5
              with: 
                context: .
                file: ./Dockerfile
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/mi-plana-web:latest
                    ${{ secrets.DOCKER_USERNAME }}/mi-plana-web:${{github.sha}}
            

                    